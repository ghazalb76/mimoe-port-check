<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 95 1350 440" width="1350" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B6A66"/>
    </marker>
    <style>
      .title { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12px; }
      .mono { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .edge { font-size: 12px; fill: #5F5E5A; }
      .line { stroke: #8A8984; stroke-width: 1.5; fill: none; }
      .model rect { fill: #EEEDFE; stroke: #7F77DD; }
      .model text { fill: #3C3489; }
      .code rect { fill: #E3F4EC; stroke: #2E9E73; }
      .code text { fill: #0F4F38; }
      .io rect { fill: #F1EFE8; stroke: #9A9892; }
      .io text { fill: #2C2C2A; }
      .side rect { stroke-dasharray: 5 4; }
      .side .title { font-size: 13.5px; }
      .badge rect { fill: #7F77DD; stroke: none; }
      .badge text { fill: #FFFFFF; font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>

  <rect x="0" y="95" width="1350" height="445" fill="#FFFFFF"/>

  <!-- Follow-up path -->
  <path class="line" d="M260,198 C260,118 592,118 592,194" marker-end="url(#arrow)"/>
  <rect x="323" y="122" width="206" height="22" rx="4" fill="#FFFFFF"/>
  <text class="edge" x="426" y="137" text-anchor="middle">follow-up: reuse last tool + args</text>

  <!-- Main row edges -->
  <path class="line" d="M165,252 L185,252" marker-end="url(#arrow)"/>
  <path class="line" d="M331,252 L351,252" marker-end="url(#arrow)"/>
  <path class="line" d="M497,252 L517,252" marker-end="url(#arrow)"/>
  <path class="line" d="M663,252 L683,252" marker-end="url(#arrow)"/>
  <path class="line" d="M829,252 L849,252" marker-end="url(#arrow)"/>
  <path class="line" d="M995,252 L1015,252" marker-end="url(#arrow)"/>
  <path class="line" d="M1161,252 L1181,252" marker-end="url(#arrow)"/>

  <!-- Branches -->
  <path class="line" d="M260,304 L260,386" marker-end="url(#arrow)"/>
  <rect x="192" y="334" width="136" height="22" rx="4" fill="#FFFFFF"/>
  <text class="edge" x="260" y="349" text-anchor="middle">off-topic or bad PID</text>

  <path class="line" d="M426,304 L426,386" marker-end="url(#arrow)"/>
  <rect x="358" y="334" width="136" height="22" rx="4" fill="#FFFFFF"/>
  <text class="edge" x="426" y="349" text-anchor="middle">invalid or ungrounded</text>
  <path class="line" d="M497,420 L592,420 L592,308" marker-end="url(#arrow)"/>

  <path class="line" d="M758,304 L758,386" marker-end="url(#arrow)"/>
  <rect x="694" y="334" width="128" height="22" rx="4" fill="#FFFFFF"/>
  <text class="edge" x="758" y="349" text-anchor="middle">nothing to explain</text>
  <path class="line" d="M829,420 L1256,420 L1256,308" marker-end="url(#arrow)"/>

  <!-- Main row nodes -->
  <g class="io">
    <rect x="23" y="200" width="142" height="104" rx="10"/>
    <text class="title" x="94" y="240" text-anchor="middle">User question</text>
    <text class="sub" x="94" y="260" text-anchor="middle">CLI or web UI</text>
    <text class="mono" x="94" y="278" text-anchor="middle">run.py, run_web.py</text>
  </g>
  <g class="code">
    <rect x="189" y="200" width="142" height="104" rx="10"/>
    <text class="title" x="260" y="240" text-anchor="middle">Route check</text>
    <text class="mono" x="260" y="260" text-anchor="middle">resolve_route()</text>
    <text class="mono" x="260" y="278" text-anchor="middle">agent.py</text>
  </g>
  <g class="model">
    <rect x="355" y="200" width="142" height="104" rx="10"/>
    <text class="title" x="426" y="240" text-anchor="middle">Tool router</text>
    <text class="sub" x="426" y="260" text-anchor="middle">valid JSON, args</text>
    <text class="sub" x="426" y="276" text-anchor="middle">grounded in question</text>
    <text class="mono" x="426" y="294" text-anchor="middle">router.py</text>
  </g>
  <g class="code">
    <rect x="521" y="200" width="142" height="104" rx="10"/>
    <text class="title" x="592" y="226" text-anchor="middle">Read-only tools</text>
    <text class="mono" x="592" y="246" text-anchor="middle">list_ports</text>
    <text class="mono" x="592" y="262" text-anchor="middle">inspect_process</text>
    <text class="mono" x="592" y="278" text-anchor="middle">check_exposure</text>
    <text class="mono" x="592" y="294" text-anchor="middle">tools.py</text>
  </g>
  <g class="code">
    <rect x="687" y="200" width="142" height="104" rx="10"/>
    <text class="title" x="758" y="240" text-anchor="middle">Risk labels</text>
    <text class="sub" x="758" y="260" text-anchor="middle">from code, not model</text>
    <text class="sub" x="758" y="276" text-anchor="middle">+ secret redaction</text>
    <text class="mono" x="758" y="294" text-anchor="middle">tools.py</text>
  </g>
  <g class="model">
    <rect x="853" y="200" width="142" height="104" rx="10"/>
    <text class="title" x="924" y="240" text-anchor="middle">Explain</text>
    <text class="sub" x="924" y="260" text-anchor="middle">local model explains</text>
    <text class="sub" x="924" y="276" text-anchor="middle">the findings</text>
    <text class="mono" x="924" y="294" text-anchor="middle">agent.py</text>
  </g>
  <g class="code">
    <rect x="1019" y="200" width="142" height="104" rx="10"/>
    <text class="title" x="1090" y="240" text-anchor="middle">Safety checks</text>
    <text class="sub" x="1090" y="260" text-anchor="middle">grounding and</text>
    <text class="sub" x="1090" y="276" text-anchor="middle">contradiction</text>
    <text class="mono" x="1090" y="294" text-anchor="middle">agent.py</text>
  </g>
  <g class="io">
    <rect x="1185" y="200" width="142" height="104" rx="10"/>
    <text class="title" x="1256" y="240" text-anchor="middle">Answer</text>
    <text class="sub" x="1256" y="260" text-anchor="middle">findings + explanation</text>
    <text class="sub" x="1256" y="276" text-anchor="middle">+ warning if flagged</text>
  </g>

  <!-- mimOE badges on model steps -->
  <g class="badge">
    <rect x="394" y="189" width="64" height="20" rx="10"/>
    <text x="426" y="203" text-anchor="middle">mimOE</text>
    <rect x="892" y="189" width="64" height="20" rx="10"/>
    <text x="924" y="203" text-anchor="middle">mimOE</text>
  </g>

  <!-- Side nodes -->
  <g class="code side">
    <rect x="189" y="390" width="142" height="74" rx="10"/>
    <text class="title" x="260" y="416" text-anchor="middle">Fixed message</text>
    <text class="mono" x="260" y="452" text-anchor="middle">agent.py</text>
    <text class="sub" x="260" y="435" text-anchor="middle">no model call</text>
  </g>
  <g class="code side">
    <rect x="355" y="390" width="142" height="74" rx="10"/>
    <text class="title" x="426" y="416" text-anchor="middle">Keyword fallback</text>
    <text class="mono" x="426" y="452" text-anchor="middle">router.py</text>
    <text class="sub" x="426" y="435" text-anchor="middle">routes from user text</text>
  </g>
  <g class="code side">
    <rect x="687" y="390" width="142" height="74" rx="10"/>
    <text class="title" x="758" y="416" text-anchor="middle">Deterministic reply</text>
    <text class="mono" x="758" y="452" text-anchor="middle">agent.py</text>
    <text class="sub" x="758" y="435" text-anchor="middle">no model call</text>
  </g>

  <!-- Legend -->
  <g font-size="13">
    <rect x="23" y="500" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="47" y="513" fill="#2C2C2A">Calls the local model in mimOE (localhost:8083)</text>
    <rect x="383" y="500" width="16" height="16" rx="4" fill="#E3F4EC" stroke="#2E9E73"/>
    <text x="407" y="513" fill="#2C2C2A">Deterministic code</text>
    <rect x="563" y="500" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#2E9E73" stroke-dasharray="4 3"/>
    <text x="587" y="513" fill="#2C2C2A">Side path that skips the model</text>
  </g>
</svg>
